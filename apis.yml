name: Core Labs
description: Core Labs is an early-stage product studio based in New York City building the future of
  professional identity and connection for the digital economy. Founded by serial entrepreneur Ajay
  Rajani (previously Grovo and Tala), the company operates in rapid-experimentation mode, incubating and
  testing consumer and productivity products. Its portfolio includes Mural, a simple portfolio-building
  tool for product managers, marketers, and digital workers that turns shared URLs into rich embeds;
  Core, a peer-and-expert mentorship platform used in university entrepreneurship programs and
  fellowships; and Makeshop, an on-demand marketplace for creative services. Core Labs is backed by 500
  Global. As of this profile the company publishes no public API, SDK, or developer platform.
